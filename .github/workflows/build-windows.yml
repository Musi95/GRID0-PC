name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: pwsh
        run: |
          choco install ninja -y
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat

      - name: Bootstrap ZeroTier dependencies
        shell: bash
        run: |
          bash scripts/bootstrap-deps.sh

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          cmake --build build --parallel

      - name: Find executables
        shell: pwsh
        run: |
          Write-Host "=== Executables ==="
          Get-ChildItem -Path build -Recurse -Filter *.exe |
            ForEach-Object {
              Write-Host $_.FullName
            }

      - name: Package executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release

          Get-ChildItem -Path build -Recurse -Filter *.exe |
            ForEach-Object {
              Copy-Item $_.FullName release\
            }

          Write-Host "=== Release contents ==="
          Get-ChildItem release

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: PC-GRID0-Windows
          path: release/
